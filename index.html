<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b2419">
<meta name="description" content="TapCraves helps local businesses get discovered on Google with Google Business Profile setup, review QR boards and social media connection.">
<title>TapCraves — Make Your Business Easier to Find</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Theme exact match with uploaded 3D TapCraves PNG images */
:root {
  --forest: #0b2419;
  --forest2: #113626;
  --emerald: #179b34;
  --neon: #32d74b;
  --green: #c5f2c7;
  --lime: #e3f9e5;
  --paper: #f4f8f5;
  --white: #ffffff;
  --ink: #0d2118;
  --muted: #53685d;
  --line: #d6e4da;
  --gold: #ffb800;
  --serif: Georgia, serif;
  --sans: 'DM Sans', sans-serif;
  --display: 'Manrope', sans-serif;
  --shadow: 0 24px 60px rgba(11, 36, 25, 0.14);
  --glow: 0 12px 32px rgba(23, 155, 52, 0.28);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { text-decoration: none; color: inherit; }
button { font: inherit; }

.wrap {
  width: min(1180px, calc(100% - 48px));
  margin: auto;
}

/* Top Announcement Bar */
.topbar {
  height: 38px;
  background: linear-gradient(90deg, #071911, #113a28, #071911);
  color: #e2f7e4;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid rgba(50, 215, 75, 0.2);
}

/* Header Navigation */
.nav {
  height: 88px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(11, 36, 25, .08);
  position: relative;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #133c2a, #081c13);
  border-radius: 13px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 6px 16px rgba(11, 36, 25, 0.2), inset 0 1px 1px rgba(255,255,255,0.2);
  border: 1px solid rgba(50, 215, 75, 0.35);
}
.logo svg { width: 30px; height: 30px; }
.brandname {
  font: 800 22px var(--display);
  letter-spacing: -.05em;
  color: var(--forest);
}
.brandname span { color: var(--emerald); }

.navlinks {
  display: flex;
  align-items: center;
  gap: 34px;
  font-size: 13.5px;
  font-weight: 700;
  color: #34493e;
}
.navlinks a:hover { color: var(--emerald); }

.navcta, .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(135deg, #1ca638, #127727);
  color: white;
  padding: 15px 24px;
  font-weight: 700;
  font-size: 13px;
  transition: .25s ease;
  cursor: pointer;
  box-shadow: var(--glow);
}
.navcta:hover, .btn:hover {
  background: linear-gradient(135deg, #22bd42, #158a2d);
  transform: translateY(-2px);
}
.menu {
  display: none;
  background: none;
  border: 0;
  color: var(--forest);
  font-size: 25px;
}

/* Hero Section */
.hero {
  background: radial-gradient(circle at 75% 40%, #194d36 0%, #0b2419 58%, #071911 100%);
  color: #f5f5ec;
  position: relative;
  overflow: hidden;
}
.hero:after {
  content: "";
  position: absolute;
  width: 620px;
  height: 620px;
  border: 1px solid rgba(50, 215, 75, 0.12);
  border-radius: 50%;
  right: -140px;
  top: -200px;
  box-shadow: 0 0 0 70px rgba(50, 215, 75, 0.04), 0 0 0 140px rgba(50, 215, 75, 0.02);
}
.hero-inner {
  min-height: 630px;
  display: grid;
  grid-template-columns: 1.02fr .98fr;
  align-items: center;
  gap: 44px;
  padding-top: 50px;
  padding-bottom: 65px;
  position: relative;
  z-index: 1;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  text-transform: uppercase;
  font-size: 10.5px;
  letter-spacing: .2em;
  font-weight: 800;
  color: #7ef08f;
  background: rgba(50, 215, 75, 0.1);
  border: 1px solid rgba(50, 215, 75, 0.25);
  padding: 7px 14px;
  border-radius: 99px;
}
.eyebrow:before {
  content: "★";
  color: var(--gold);
  font-size: 12px;
}
h1 {
  font: 800 clamp(44px, 5.8vw, 74px)/1.03 var(--display);
  letter-spacing: -.065em;
  margin: 22px 0 20px;
  max-width: 650px;
}
h1 em {
  font-family: var(--serif);
  font-weight: 400;
  color: #7ef08f;
  letter-spacing: -.04em;
}
.hero-copy {
  font-size: 16px;
  line-height: 1.8;
  color: #cfe3d5;
  max-width: 510px;
}
.hero-actions {
  display: flex;
  gap: 13px;
  margin-top: 32px;
  flex-wrap: wrap;
}
.btn-light {
  background: linear-gradient(135deg, #32d74b, #1ca638);
  color: #061c11;
  font-weight: 800;
}
.btn-light:hover {
  background: linear-gradient(135deg, #52e568, #24bd43);
  color: #061c11;
}
.btn-outline {
  border: 1px solid rgba(255, 255, 255, 0.35);
  background: rgba(255, 255, 255, 0.05);
  color: white;
  box-shadow: none;
}
.btn-outline:hover {
  background: rgba(255, 255, 255, 0.14);
}
.trustline {
  display: flex;
  gap: 24px;
  margin-top: 44px;
  color: #bdd4c4;
  font-size: 11.5px;
  font-weight: 600;
  align-items: center;
}
.trustline span {
  display: flex;
  align-items: center;
  gap: 8px;
}
.trustline i {
  width: 6px;
  height: 6px;
  background: var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--gold);
}

/* Hero Art with reviewboard.png */
.hero-art {
  position: relative;
  min-height: 460px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.orbit {
  position: absolute;
  width: 440px;
  height: 440px;
  border: 1px solid rgba(50, 215, 75, 0.22);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(50, 215, 75, 0.16) 0%, transparent 70%);
}
.orbit:before, .orbit:after {
  content: "";
  position: absolute;
  border: 1px dashed rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  inset: 34px;
}
.orbit:after { inset: 82px; }

.stand-scene {
  position: relative;
  width: 100%;
  max-width: 540px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}
.hero-main-img {
  width: 100%;
  max-width: 530px;
  height: auto;
  display: block;
  filter: drop-shadow(0 28px 42px rgba(0, 0, 0, 0.48));
  animation: floatImg 5s ease-in-out infinite;
}
@keyframes floatImg {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

.floating-note {
  position: absolute;
  right: 4px;
  top: 22px;
  background: linear-gradient(135deg, #ffffff, #e9f9eb);
  color: var(--forest);
  padding: 13px 18px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 800;
  box-shadow: 0 18px 40px rgba(0,0,0,0.32);
  border: 2px solid #32d74b;
  transform: rotate(4deg);
  z-index: 4;
}
.floating-note b {
  display: block;
  font: 800 24px var(--display);
  letter-spacing: -.06em;
  color: var(--emerald);
}
.floating-tag {
  position: absolute;
  left: 0px;
  bottom: 18px;
  background: rgba(11, 36, 25, 0.92);
  backdrop-filter: blur(8px);
  color: #ffffff;
  padding: 12px 17px;
  border-radius: 10px;
  border: 1px solid rgba(50, 215, 75, 0.4);
  box-shadow: 0 16px 36px rgba(0,0,0,0.35);
  font-size: 11.5px;
  font-weight: 700;
  transform: rotate(-2deg);
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 8px;
}
.floating-tag::before {
  content: "★★★★★";
  color: var(--gold);
  letter-spacing: 1px;
}

/* Visual Showcase Banner using the 3 uploaded PNGs */
.visual-triad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 36px;
}
.triad-card {
  background: linear-gradient(180deg, #ffffff 0%, #edf7ef 100%);
  border: 1px solid #cde2d2;
  border-radius: 18px;
  padding: 22px 20px 18px;
  text-align: center;
  box-shadow: 0 14px 34px rgba(11, 36, 25, 0.06);
  transition: .3s ease;
  position: relative;
  overflow: hidden;
}
.triad-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow);
  border-color: #32d74b;
}
.triad-card img {
  width: 100%;
  height: 195px;
  object-fit: contain;
  display: block;
  margin: 0 auto 12px;
  filter: drop-shadow(0 12px 20px rgba(11, 36, 25, 0.14));
  transition: transform .35s ease;
}
.triad-card:hover img {
  transform: scale(1.05);
}
.triad-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #e1f6e4;
  color: #116824;
  font: 800 10px var(--display);
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 5px 11px;
  border-radius: 99px;
  margin-bottom: 6px;
}
.triad-card h4 {
  margin: 4px 0 0;
  font: 800 17px var(--display);
  color: var(--forest);
  letter-spacing: -.03em;
}

/* Sections */
.section { padding: 100px 0; }
.section-head {
  max-width: 650px;
  margin-bottom: 48px;
}
.kicker {
  color: var(--emerald);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .2em;
  text-transform: uppercase;
}
.section h2 {
  font: 800 clamp(34px, 4vw, 52px)/1.08 var(--display);
  letter-spacing: -.06em;
  margin: 14px 0;
}
.section-head p {
  font-size: 15px;
  line-height: 1.8;
  color: var(--muted);
  max-width: 560px;
}

/* Services Grid */
.services {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.service {
  background: #fff;
  padding: 30px 27px;
  min-height: 230px;
  border: 1px solid #dce9df;
  border-radius: 16px;
  transition: .3s;
  position: relative;
}
.service:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow);
  border-color: #32d74b;
}
.service-no {
  font: 800 11px var(--display);
  color: var(--emerald);
  letter-spacing: .12em;
}
.service-icon {
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, #e5f9e7, #c9f0ce);
  border-radius: 13px;
  display: grid;
  place-items: center;
  margin: 20px 0 18px;
  color: var(--forest);
  border: 1px solid rgba(23, 155, 52, 0.2);
}
.service-icon svg {
  width: 22px;
  height: 22px;
  stroke: var(--emerald);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.service h3 {
  font: 800 18px var(--display);
  letter-spacing: -.03em;
  margin: 0 0 9px;
}
.service p {
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--muted);
  margin: 0;
}

/* Split Editorial Section */
.split {
  background: linear-gradient(180deg, #e5f2e8 0%, #ebf5ed 100%);
  border-top: 1px solid #d2e4d6;
  border-bottom: 1px solid #d2e4d6;
}
.split-inner {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  gap: 72px;
  align-items: center;
}
.editorial-card {
  background: radial-gradient(circle at 80% 20%, #195239 0%, #0b2419 75%);
  padding: 42px;
  color: #fff;
  min-height: 420px;
  border-radius: 22px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid rgba(50, 215, 75, 0.3);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.editorial-card:after {
  content: "TC";
  position: absolute;
  right: -8px;
  bottom: -65px;
  font: 800 210px var(--display);
  letter-spacing: -.12em;
  color: #ffffff08;
  pointer-events: none;
}
.editorial-card .bigline {
  font: 800 38px/1.06 var(--display);
  letter-spacing: -.06em;
  max-width: 340px;
  margin: 18px 0 14px;
}
.editorial-card p {
  font-size: 13.5px;
  line-height: 1.8;
  color: #cae0d0;
  max-width: 340px;
  margin: 0;
}
.editorial-card .smallline {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #7ef08f;
}
.editorial-img-wrap {
  margin-top: 22px;
  display: flex;
  justify-content: center;
  position: relative;
  z-index: 2;
}
.editorial-img-wrap img {
  width: 100%;
  max-width: 310px;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 16px 28px rgba(0,0,0,0.45));
}

.checks {
  display: grid;
  gap: 20px;
  margin-top: 30px;
}
.check {
  display: flex;
  gap: 14px;
  background: rgba(255,255,255,0.7);
  padding: 16px 18px;
  border-radius: 14px;
  border: 1px solid #cfe3d4;
}
.checkmark {
  width: 28px;
  height: 28px;
  flex: none;
  border-radius: 50%;
  background: linear-gradient(135deg, #32d74b, #179b34);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 800;
  box-shadow: 0 4px 10px rgba(23, 155, 52, 0.25);
}
.check b {
  display: block;
  font: 800 15px var(--display);
  margin-bottom: 4px;
}
.check span {
  display: block;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

/* Process Section */
.process {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.step {
  background: #ffffff;
  padding: 32px 28px;
  border-radius: 18px;
  border: 1px solid #d8e8dc;
  box-shadow: 0 10px 28px rgba(11, 36, 25, 0.04);
}
.step-num {
  display: inline-block;
  font: 800 11px var(--display);
  color: #116824;
  background: #e1f6e4;
  padding: 5px 11px;
  border-radius: 99px;
  letter-spacing: .1em;
}
.step h3 {
  font: 800 20px var(--display);
  letter-spacing: -.04em;
  margin: 20px 0 9px;
}
.step p {
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--muted);
  margin: 0;
}

/* Pricing Section with tapcravesboard.png */
.pricing {
  background: radial-gradient(circle at 25% 50%, #174933 0%, #0b2419 65%, #071810 100%);
  color: white;
  padding: 96px 0;
  position: relative;
  overflow: hidden;
}
.price-inner {
  display: grid;
  grid-template-columns: 1.08fr .92fr;
  gap: 64px;
  align-items: center;
}
.pricing .kicker { color: #7ef08f; }
.pricing h2 {
  font: 800 clamp(38px, 4.5vw, 56px)/1.05 var(--display);
  letter-spacing: -.065em;
  margin: 15px 0;
}
.pricing p {
  color: #cae0d0;
  font-size: 14.5px;
  line-height: 1.8;
  max-width: 480px;
}
.pricing-board-preview {
  margin-top: 28px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(50, 215, 75, 0.28);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  max-width: 500px;
}
.pricing-board-preview img {
  width: 150px;
  height: auto;
  flex-shrink: 0;
  filter: drop-shadow(0 14px 24px rgba(0,0,0,0.4));
}
.pricing-board-copy b {
  display: block;
  font: 800 16px var(--display);
  color: #fff;
  margin-bottom: 6px;
}
.pricing-board-copy span {
  font-size: 12.5px;
  line-height: 1.6;
  color: #b9d4c0;
  display: block;
}
.pricing-stars {
  color: var(--gold);
  font-size: 14px;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.price-card {
  background: #ffffff;
  color: var(--forest);
  padding: 36px 36px;
  border-radius: 20px;
  box-shadow: 0 28px 70px rgba(0, 0, 0, 0.4);
  border: 2px solid #32d74b;
  position: relative;
}
.price-label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .18em;
  color: var(--emerald);
  font-weight: 800;
}
.price {
  font: 800 58px var(--display);
  letter-spacing: -.08em;
  margin: 10px 0 0;
  color: var(--forest);
}
.price small {
  font-size: 15px;
  letter-spacing: 0;
  color: #5b7063;
  font-weight: 600;
}
.lifetime {
  display: inline-block;
  background: linear-gradient(135deg, #e1f8e4, #c5f0cb);
  color: #0e6320;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 7px 12px;
  border-radius: 6px;
  margin: 8px 0 18px;
}
.price-list {
  list-style: none;
  padding: 0;
  margin: 0 0 25px;
  border-top: 1px solid #e2ece4;
}
.price-list li {
  padding: 11.5px 0;
  border-bottom: 1px solid #e2ece4;
  font-size: 13px;
  font-weight: 600;
  color: #2f4337;
  display: flex;
  gap: 10px;
  align-items: center;
}
.price-list li:before {
  content: "✓";
  font-weight: 800;
  color: #ffffff;
  background: var(--emerald);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  font-size: 11px;
  flex-shrink: 0;
}
.price-card .btn {
  width: 100%;
  padding: 16px;
  font-size: 14px;
}

/* FAQ Section */
.faq {
  display: grid;
  grid-template-columns: .75fr 1.25fr;
  gap: 80px;
}
.faq-list details {
  border-bottom: 1px solid var(--line);
  padding: 19px 0;
}
.faq-list summary {
  cursor: pointer;
  list-style: none;
  font: 700 15.5px var(--display);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}
.faq-list summary:after {
  content: "+";
  font-size: 20px;
  color: var(--emerald);
  font-weight: 800;
}
.faq-list details[open] summary:after { content: "−"; }
.faq-list p {
  font-size: 13.5px;
  line-height: 1.8;
  color: var(--muted);
  max-width: 570px;
  margin: 10px 0 0;
}

/* Contact CTA Section */
.contact {
  background: linear-gradient(135deg, #e3f3e6 0%, #d4ecda 100%);
  padding: 78px 0;
  border-top: 1px solid #c5e0cb;
}
.contact-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
}
.contact h2 {
  font: 800 clamp(32px, 4vw, 48px)/1.05 var(--display);
  letter-spacing: -.06em;
  margin: 12px 0;
}
.contact p {
  font-size: 14.5px;
  color: var(--muted);
  line-height: 1.7;
}
.contact-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.btn-ghost {
  background: #ffffff;
  color: var(--forest);
  border: 1px solid #9fc4a7;
  box-shadow: none;
}
.btn-ghost:hover {
  background: #eff8f1;
}

/* Footer */
.footer {
  background: #071911;
  color: #dce6dc;
  padding: 55px 0 25px;
}
.footer-top {
  display: flex;
  justify-content: space-between;
  gap: 35px;
  padding-bottom: 42px;
  border-bottom: 1px solid #ffffff1a;
}
.footer .brandname { color: white; }
.footer-copy {
  font-size: 12.5px;
  color: #9ab3a1;
  line-height: 1.8;
  max-width: 300px;
  margin-top: 16px;
}
.footer-links {
  display: flex;
  gap: 65px;
}
.footer-col b {
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #7ef08f;
}
.footer-col a {

/* Floating WhatsApp Button */
.whatsapp {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 30;
  background: linear-gradient(135deg, #32d74b, #179b34);
  color: #ffffff;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  box-shadow: 0 10px 28px rgba(23, 155, 52, 0.45);
  transition: .25s;
}
.whatsapp:hover {
  transform: translateY(-4px) scale(1.05);
}
.whatsapp svg {
  width: 26px;
  height: 26px;
  fill: currentColor;
}

.reveal {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity .7s ease, transform .7s ease;
}
.reveal.visible {
  opacity: 1;
  transform: none;
}
